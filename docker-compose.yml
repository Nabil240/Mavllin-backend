services:
  mysql:
    image: mysql:8.0
    container_name: project_eco_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: eco_user
      MYSQL_PASSWORD: eco_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: project_eco_pma
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"

volumes:
  mysql_data:
